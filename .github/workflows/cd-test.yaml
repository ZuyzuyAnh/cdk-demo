name: CI/CD → Deploy to Test

on:
  push:
    branches:
      - develop

env:
  AWS_REGION: us-east-1
  CDK_OUT: cdk.out

jobs:
  cdk-synth:
    name: CDK Synth & Diff
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490332585612:role/github_action_role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: CDK Synth
        run: cdk synth --all

      - name: CDK Diff
        run: |
          DIFF=$(cdk diff --all 2>&1 || true)
          echo "$DIFF"
          if echo "$DIFF" | grep -q "There were no differences"; then
            echo "✅ No infrastructure changes detected"
          else
            echo "⚠️ Infrastructure changes detected:"
            echo "$DIFF"
          fi

      - name: Upload Cloud Assembly
        uses: actions/upload-artifact@v3
        with:
          name: cloud-assembly
          path: ${{ env.CDK_OUT }}

  deploy-test:
    name: 🚀 Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: cdk-synth
    environment: test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Download Cloud Assembly
        uses: actions/download-artifact@v3
        with:
          name: cloud-assembly
          path: ${{ env.CDK_OUT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490332585612:role/github_action_role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: CDK Deploy (Test)
        run: |
          cdk deploy --require-approval never --all --outputs-file cdk-outputs-test.json

      - name: Upload Deploy Outputs
        uses: actions/upload-artifact@v3
        with:
          name: cdk-outputs-test
          path: cdk-outputs-test.json

  integration-tests:
    name: 🌐 Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490332585612:role/github_action_role
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Deploy Outputs
        uses: actions/download-artifact@v3
        with:
          name: cdk-outputs-test
          path: .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install requests

      - name: Run Integration Tests
        run: python scripts/run_integration_tests.py
